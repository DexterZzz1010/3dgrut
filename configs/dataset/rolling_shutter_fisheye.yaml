type: rolling_shutter_fisheye
downsample_factor: 2
test_split_interval: 10
# 图像过滤配置 - 只保留FC文件夹下的图像
image_name_filter:
  enabled: true
  # include_prefixes: ["FC/"]
  # exclude_prefixes: ["FISHB/", "FISHF/", "FISHL/", "FISHR/"]
  include_prefixes: ["FISHB/", "FISHF/", "FISHL/", "FISHR/"]
  exclude_prefixes: ["FC/"]

# Mask配置
mask_config:
  enabled: true
  source_type: "colmap_structure"
  base_path: "colmap/masks_rectified"
  file_extensions: [".jpg.png", ".png", ".jpg"]
  fallback_to_standard: false

max_points: 5000000