type: autoencoder

# Common parameters from FeatureCompressor
n_components: 32  # Number of compressed dimensions

# Autoencoder-specific parameters
hidden_dims: [512, 256, 128]  # Hidden layer dimensions (None for linear projection)
activation: relu  # Activation function (relu, leaky_relu, elu, gelu)
dropout: 0.1  # Dropout rate (0 to disable) 